{% extends "base.html" %}
{% block title %}Login - Eyentra{% endblock %}

{% block content %}
<div class="auth-card">
    <p class="eyebrow">Welcome back</p>
    <h2>Login to Eyentra</h2>
    <p class="auth-sub">Use your verified mobile number and password.</p>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="e.g. 9876543210" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Log In</button>
    </form>

    <p class="auth-switch">
        New here? <a href="{{ url_for('register') }}">Create a free account</a>
    </p>
</div>
{% endblock %}
